<!--
  Template del menú lateral (sidemenu). Contiene el header del
  menú con avatar, nombre y subtítulo; la lista de navegación;
  y el footer con la versión de la app.
-->
<ion-app>
  <ion-split-pane contentId="main-content">

    <!-- ══════════════════════════ MENÚ LATERAL ══════════════════════════ -->
    <ion-menu contentId="main-content" type="overlay">
      <ion-content class="menu-content">

        <!-- Header del menú: avatar, nombre y rol profesional -->
        <div class="menu-header">
          <ion-avatar class="menu-avatar">
            <img src="assets/yo.jpg" alt="Avatar" />
          </ion-avatar>
          <h2 class="menu-name">Fernando Marcano</h2>
          <p class="menu-subtitle">T.S.U. en Informática</p>
        </div>

        <!-- Separador visual -->
        <div class="menu-divider"></div>

        <!-- Lista de navegación del menú lateral -->
        <ion-list class="menu-list" lines="none">
          @for (p of appPages; track p.url) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                [routerLink]="[p.url]"
                routerLinkActive="menu-item-active"
                routerDirection="root"
                detail="false"
                class="menu-item"
              >
                <!-- Icono de la página con variantes ios/md -->
                <ion-icon
                  aria-hidden="true"
                  slot="start"
                  [ios]="p.icon + '-outline'"
                  [md]="p.icon + '-sharp'"
                  class="menu-icon"
                ></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <!-- Separador visual antes del footer -->
        <div class="menu-divider"></div>

        <!-- Footer del menú con versión de la aplicación -->
        <div class="menu-footer">
          <ion-note>Mi Portafolio</ion-note>
          <ion-note class="menu-version">v1.0.0</ion-note>
        </div>

      </ion-content>
    </ion-menu>

    <!-- Punto de salida del router — aquí se renderizan las páginas -->
    <ion-router-outlet id="main-content"></ion-router-outlet>

  </ion-split-pane>
</ion-app>
