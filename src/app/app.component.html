<!--
  Componente raíz con barra de navegación superior global.
  Reemplaza al menú lateral anterior.
-->
<ion-app>
  <!-- Barra de navegación global superior -->
  <ion-header class="global-header ion-no-border">
    <ion-toolbar color="primary">
      <!-- Título de la App -->
      <ion-title slot="start" class="app-title">Portafolio | F.M</ion-title>

      <!-- Botones de Navegación -->
      <ion-buttons slot="end" class="nav-links">
        @for (p of appPages; track p.url) {
          <ion-button 
            [routerLink]="[p.url]" 
            routerLinkActive="active-nav-link" 
            routerDirection="root"
            class="nav-btn">
            <ion-icon slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
            {{ p.title }}
          </ion-button>
        }
        
        <!-- Separador visual pequeño -->
        <div class="nav-divider"></div>

        <!-- Botón de Modo Oscuro -->
        <ion-button (click)="themeService.toggleTheme()" aria-label="Cambiar tema" class="theme-btn">
          <ion-icon slot="icon-only" [name]="(themeService.isDarkMode$ | async) ? 'sunny-outline' : 'moon-outline'"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Punto de salida del router — aquí se renderizan las páginas debajo del header -->
  <ion-router-outlet id="main-content" style="margin-top: 56px;"></ion-router-outlet>
</ion-app>
